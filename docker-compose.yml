# Run from the repository root with:
# docker compose --env-file yusi_prod.env -f mcp/docker-compose.yml up -d
services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: yusi-mcp:latest
    container_name: yusi-mcp
    restart: unless-stopped
    expose:
      - "11611"
    environment:
      - GIN_MODE=release
      - TZ=Asia/Shanghai
      - SERVER_ENV=prod
      - LOG_LEVEL=info
      - SERVER_AUTH_API_KEY=${MCP_AUTH_API_KEY:?MCP_AUTH_API_KEY is required}
      - GRPC_BACKEND_TARGET=${GRPC_BACKEND_TARGET:-yusi:9090}
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-bocha}
      - SEARCH_API_KEY=${SEARCH_API_KEY:?SEARCH_API_KEY is required}
      - SEARCH_CX=${SEARCH_CX:-}
    # volumes:
    #   - ./config:/app/config:ro  # 挂载配置文件（如需要）
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:11611/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - my-network

networks:
  my-network:
    driver: bridge
    external: true
